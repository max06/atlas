name: ATLAS Render
description: >
  Render one side (PR or baseline) of an ATLAS helmfile deployment.
  Discovers deployments, runs helmfile template, and captures redaction
  maps for the replay pipeline. Two auxiliary modes support changed-file
  render subsetting: "discover" emits the tree's discovery map, "classify"
  turns two maps plus the changed-file list into the render subset.

inputs:
  mode:
    description: >
      "render" (default) renders the checked-out tree; "discover" writes the
      ATLAS discovery map of the checked-out tree; "classify" selects the
      render subset from two maps and a changed-file list.
    required: false
    default: render
  helmfile-path:
    description: Path to the helmfile entry point
    required: false
    default: helmfile.yaml.gotmpl
  snapshot-label:
    description: Label for this render side ("pr" or "baseline")
    required: true
  pairs-file:
    description: >
      Render mode only. Path to a "<cluster>|<deployment>" line file (from
      classify). When set, only those pairs are rendered (subset mode);
      when empty, the full tree is discovered and rendered.
    required: false
  map-baseline:
    description: Classify mode — discovery map JSON of the target branch
    required: false
  map-pr:
    description: Classify mode — discovery map JSON of the merge result
    required: false
  changes-file:
    description: Classify mode — `git diff --name-status --no-renames` output
    required: false
  sops-age-key:
    description: >
      SOPS Age private key for decrypting *.values.sops.yaml files.
      Omit if your repo has no encrypted values.
    required: false
  enable-sidedump:
    description: >
      Enable redaction-map side-dump (set to "true" for the PR render).
      The captured maps are used by the replay step to scrub the baseline.
    required: false
    default: "false"
  blocking:
    description: >
      Whether render errors are blocking ("true" for PR, "false" for baseline).
      Blocking errors are reported as ::error, non-blocking as ::warning.
    required: false
    default: "true"
  merge-fallback:
    description: Set to "true" if the merge ref was unavailable and we fell back to the PR branch
    required: false
    default: "false"

outputs:
  status:
    description: Render result — success, error, or missing
  snapshot-dir:
    description: Path to the rendered manifest tree
  sidedump-dir:
    description: Path to captured redaction maps (only when enable-sidedump is true)
  list-json:
    description: >
      Path to the discovery JSON (same shape as `helmfile list --output json`,
      derived from `helmfile build` — see render.sh for why)
  filter-supported:
    description: Whether helmfile --selector filtering worked (true/false)
  workflow-pin:
    description: Detected ATLAS workflow ref from the caller's workflow file
  merge-fallback:
    description: Set to true when the merge ref was unavailable
  render-mode:
    description: Render mode — full or subset
  rendered-pairs:
    description: Number of (cluster, deployment) pairs rendered
  map-file:
    description: Discover mode — path of the written discovery map (empty when unsupported)
  map-status:
    description: Discover mode — ok / unsupported (ATLAS without map mode) / error
  mode:
    description: Classify mode — subset / full
  reason:
    description: Classify mode — why a full render was chosen
  classify-dir:
    description: Classify mode — directory with classify.json, pairs files and the comment fragment
  pairs-baseline-file:
    description: Classify mode — pairs file for the baseline render
  pairs-pr-file:
    description: Classify mode — pairs file for the PR render
  selected-pr:
    description: Classify mode — selected pairs on the PR side
  total-pr:
    description: Classify mode — total pairs on the PR side

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_HELMFILE_PATH: ${{ inputs.helmfile-path }}
    INPUT_SNAPSHOT_LABEL: ${{ inputs.snapshot-label }}
    INPUT_SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
    INPUT_ENABLE_SIDEDUMP: ${{ inputs.enable-sidedump }}
    INPUT_BLOCKING: ${{ inputs.blocking }}
    INPUT_MERGE_FALLBACK: ${{ inputs.merge-fallback }}
    INPUT_MODE: ${{ inputs.mode }}
    INPUT_PAIRS_FILE: ${{ inputs.pairs-file }}
    INPUT_MAP_BASELINE: ${{ inputs.map-baseline }}
    INPUT_MAP_PR: ${{ inputs.map-pr }}
    INPUT_CHANGES_FILE: ${{ inputs.changes-file }}
