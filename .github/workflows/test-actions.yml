# Tests for the ATLAS Review pipeline and the native engine, through the
# atlas CLI the review actions run. The bats assertions were written against
# the bash scripts under .github/actions/ (the reference implementation of the
# port); shims in tests/bats/helpers/cli-actions serve each script's contract
# through `atlas review ci`. The scripts themselves are no longer tested here:
# no action runs them since the review moved to the CLI.
#
# Separated from the main tests.yml matrix because the review pipeline has
# its own tool dependencies (dyff) and doesn't need Helm/Helmfile version
# matrix coverage. The suites run as parallel jobs.

name: Action Tests

on:
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - tests/bats/workflow/**
      - tests/bats/helpers/**
      - tests/bats/redaction/redaction-replay.bats
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
  pull_request:
    paths:
      - .github/actions/**
      - tests/bats/workflow/**
      - tests/bats/helpers/**
      - tests/bats/redaction/redaction-replay.bats
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    name: go vet + unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Go vet + unit tests
        run: |
          go vet ./...
          go test ./...

  suites:
    runs-on: ubuntu-latest
    name: action tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # the review pipeline through the atlas CLI
          - suite: review workflow
            backend: cli
            engine: ""
            paths: tests/bats/workflow/ tests/bats/redaction/redaction-replay.bats
          # the core suites (values, redaction, integration) against the
          # native Go engine: a helmfile shim renders the native states for
          # every call with the test entry (tests/bats/helpers/native-engine),
          # the assertions stay the ones of the templates
          - suite: native engine
            backend: ""
            engine: native
            paths: tests/bats/values/ tests/bats/redaction/ tests/bats/integration/
    env:
      SOPS_AGE_KEY_FILE: ${{ github.workspace }}/tests/sops-secret.txt
    steps:
      - uses: actions/checkout@v7

      - name: Install SOPS
        uses: nhedger/setup-sops@v3

      - name: Install helm
        run: |
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/helm/helm/releases/latest | jq -r .tag_name)
          curl -fsSL "https://get.helm.sh/helm-${VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64

      - name: Install helmfile
        run: |
          VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/helmfile/helmfile/releases/latest | jq -r .tag_name)
          CLEAN_VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/${VERSION}/helmfile_${CLEAN_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv helmfile /usr/local/bin/helmfile

      - name: Install helmfile plugins
        run: helmfile init --force 2>/dev/null || true

      - name: Install bats, yq, dyff, and parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y bats parallel
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          DYFF_VERSION=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/homeport/dyff/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/homeport/dyff/releases/download/${DYFF_VERSION}/dyff_${DYFF_VERSION#v}_linux_amd64.tar.gz" | tar xz
          sudo mv dyff /usr/local/bin/dyff

      # The atlas CLI (cmd/atlas): the review backend of the shims, the
      # native engine, and cli.bats drives the binary end to end.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the atlas CLI
        run: |
          go build -o "${RUNNER_TEMP}/atlas" ./cmd/atlas
          echo "ATLAS_CLI=${RUNNER_TEMP}/atlas" >> "$GITHUB_ENV"

      - name: Run the ${{ matrix.suite }} suites
        env:
          ATLAS_REVIEW_BACKEND: ${{ matrix.backend }}
          ATLAS_ENGINE: ${{ matrix.engine }}
        run: bats --recursive --jobs 4 ${{ matrix.paths }}
