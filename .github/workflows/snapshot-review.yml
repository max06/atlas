# ATLAS Review — Reusable GitHub Actions Workflow
#
# DEPRECATED: the review is an action now (`uses: max06/atlas@<release>` in
# your own job, README section "CI / Review"). This workflow is removed in
# the next minor release.
#
# Compares rendered Kubernetes manifests between the current target branch HEAD
# and the merge result of a pull request. The review itself is ONE container
# step (action atlas-review: the atlas CLI in the prebuilt atlas image); the
# workflow keeps the checkout, the baseline resolution and the comment.
# (The step-wise actions atlas-render and atlas-diff stay available.)
#
# Merge-result strategy: the baseline is the live target-branch HEAD (what is
# deployed now); the PR side is GitHub's trial merge ref (what will be deployed
# after merging). This avoids both false positives and hidden-impact diffs that
# plague branch-origin comparisons. See the old monolith for the full rationale.
#
# Error handling:
#   - Baseline render errors → warning (the PR may be the fix)
#   - PR render errors → pipeline failure (can't verify the PR is safe)
#
# Changed-file render subsetting (input `render-subset`):
#   The ATLAS directory convention is the dependency graph, so the PR's changed
#   paths select the (cluster, deployment) pairs whose render can differ. Both
#   revisions' discovery maps (ATLAS_DISCOVERY_MAP) plus `git diff --name-status`
#   feed the classifier; default-deny — anything
#   outside deployments/templates, global values, or the entry helmfile means a
#   full render. Modes:
#     off    — classic full render, no classification
#     shadow — full render, classification computed alongside and CHECKED: every
#              changed release must lie inside the selection (default; the cutover
#              gate — a violation surfaces as a warning in the comment)
#     on     — render only the selection
#   Escape hatch: a PR label (input `full-render-label`) forces `off`. A pinned
#   ATLAS without map support falls back to a full render automatically.
#
# Usage in consumer repos:
#
#   # .github/workflows/atlas-review.yml
#   name: ATLAS Review
#   on:
#     pull_request:
#       branches: [main]
#   jobs:
#     review:
#       uses: max06/atlas/.github/workflows/snapshot-review.yml@main
#       with:
#         helmfile-path: helmfile.yaml.gotmpl
#       secrets:
#         sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
#
# Keeping the key away from other branches (pull_request_target):
#   A repository secret is readable by any workflow on any branch, so anyone
#   who can push a branch can read it. To prevent that:
#   1. Store the key as the secret SOPS_AGE_KEY in a GitHub environment whose
#      deployment branches are only the protected target branches.
#   2. Trigger the caller on `pull_request_target` instead of `pull_request`:
#      GitHub then takes the workflow definition from the target branch, and
#      a PR cannot edit it.
#   3. Pass the environment name and `secrets: inherit`:
#
#   on:
#     pull_request_target:
#       branches: [main]
#   jobs:
#     review:
#       uses: max06/atlas/.github/workflows/snapshot-review.yml@<version>
#       with:
#         environment: atlas-review
#       secrets: inherit
#
#   The review still checks out and renders the PR's merge result. The diff
#   is the same as with `pull_request`.
#   Limit: the render runs the PR's templates while the key is present, and
#   templates can run commands. Use `pull_request_target` only where everyone
#   who can open a PR is trusted. PRs from forks are skipped under
#   `pull_request_target`.

name: ATLAS Review

on:
  workflow_call:
    inputs:
      helmfile-path:
        description: "Path to the helmfile entry point"
        type: string
        default: "helmfile.yaml.gotmpl"
      diff-mode:
        description: 'Diff engine: "dyff" (default) for YAML-aware semantic diffs, "classic" for standard unified diffs'
        type: string
        default: "dyff"
      render-subset:
        description: 'Changed-file render subsetting: "off" (default — full render), "shadow" (full render + coverage check of the classifier), or "on" (render only the selection)'
        type: string
        default: "off"
      full-render-label:
        description: "PR label that forces a full render (subsetting off) for that PR"
        type: string
        default: "atlas-full-render"
      runs-on:
        description: 'Runner for the review job: a label ("ubuntu-latest", "linux-amd-8") or a JSON object, e.g. {"group":"Default larger runners","labels":["linux-amd-8"]}. Full renders of large repositories need more than a standard runner.'
        type: string
        default: "ubuntu-latest"
      environment:
        description: 'GitHub environment for the review job. Its secret SOPS_AGE_KEY is the key when the secret sops-age-key is not passed. Empty (default): no environment.'
        type: string
        default: ""
    secrets:
      sops-age-key:
        required: false
        description: "SOPS Age private key for decrypting *.values.sops.yaml files"
      SOPS_AGE_KEY:
        required: false
        description: "Fallback name of the key, for `secrets: inherit` and environment secrets (input `environment`)"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # pull_request_target runs with the target repository's secrets: never
    # for a PR from a fork, whose templates the render would run.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: ${{ inputs.environment }}
    runs-on: ${{ startsWith(inputs.runs-on, '{') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - name: Deprecation notice
        run: |
          echo "::warning::The reusable workflow snapshot-review.yml is deprecated and will be removed in the next minor release. Use the action: 'uses: max06/atlas@<release>' in your own job. Migration: README, section 'CI / Review'."

      - name: Check for latest ATLAS release
        id: latest-release
        continue-on-error: true
        run: |
          LATEST_TAG=$(gh release list -R max06/atlas --limit 1 \
            --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          MAIN_SHA=$(gh api repos/max06/atlas/commits/main \
            --jq '.sha' 2>/dev/null || echo "")
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Subsetting mode ────────────────────────────────────────────────────
      - name: Determine render-subsetting mode
        id: subset
        env:
          REQUESTED: ${{ inputs.render-subset }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, inputs.full-render-label) }}
        run: |
          MODE="$REQUESTED"
          case "$MODE" in off|shadow|on) ;; *) echo "::warning::render-subset='$MODE' unknown — using off"; MODE=off ;; esac
          if [ "$LABELED" = "true" ]; then
            echo "PR carries the full-render label — subsetting off for this run"
            MODE=off
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # ── Render merge result (PR side) ──────────────────────────────────────
      # Order matters: PR render runs first to capture sidedump maps that the
      # replay step uses to scrub the (potentially leaky) baseline.
      # fetch-depth 2: the merge commit's first parent IS the target commit the
      # merge was made against — the baseline. A separately fetched target tip
      # can be newer (main moved since GitHub built the merge ref) and would
      # show those newer commits as reverted by the PR.
      - name: Checkout merge result
        id: merge-checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          # The review container works on the fetched commits only and must
          # not see the job token; the one fetch below carries it explicitly.
          persist-credentials: false
        continue-on-error: true

      - name: Fallback to PR branch
        if: steps.merge-checkout.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Baseline commit: merge^1 normally. Without a merge ref (conflicts) the
      # PR branch is compared with its merge-base, so the diff shows the PR's
      # own changes, not everything the target gained since the branch point.
      - name: Resolve baseline
        id: baseline-rev
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK: ${{ steps.merge-checkout.outcome == 'failure' }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # Token scoped to this one command; the checkout keeps no credentials.
          fetch() {
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              fetch -q --depth=1 origin "$1"
          }
          SHA=""
          if [ "$FALLBACK" != "true" ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            SHA="$(git rev-parse 'HEAD^1')"
            echo "Baseline: merge^1 = $SHA"
          else
            SHA="$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
            if [ -n "$SHA" ] && fetch "$SHA"; then
              echo "Baseline: merge-base of the PR = $SHA"
            else
              echo "::warning::Could not resolve the merge-base — comparing with the target branch tip"
              fetch "refs/heads/${BASE_REF}" && SHA="$(git rev-parse FETCH_HEAD)"
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ── Diagnostics (debug logging only) ───────────────────────────────────
      # A host-side monitor, outside the action container: if the review
      # stalls, the log still shows the containers, processes, memory and disk.
      - name: Start host monitor (debug)
        if: runner.debug == '1'
        run: |
          nohup bash -c 'while true; do
            echo "=== $(date -u +%H:%M:%S)"; free -m | head -2; df -h / | tail -1
            for c in $(docker ps -q 2>/dev/null); do
              echo "--- container $(docker inspect -f "{{.Name}}" "$c")"
              docker top "$c" -eo pid,ppid,stat,etime,pcpu,rss,wchan:24,args 2>/dev/null | cut -c1-220
              pid=$(docker inspect -f "{{.State.Pid}}" "$c")
              echo "--- connections"
              sudo nsenter -t "$pid" -n ss -tnp 2>/dev/null | cut -c1-200 | head -20
            done
            for f in "$RUNNER_TEMP"/*-stderr.log; do [ -f "$f" ] && { echo "--- tail $f"; tail -n 3 "$f" | cut -c1-200; }; done
            sleep 15; done' > "$RUNNER_TEMP/host-monitor.log" 2>&1 &
          echo "host monitor started"

      # ── The review ─────────────────────────────────────────────────────────
      # One container step (atlas CLI): discovery maps of both commits,
      # classification, both renders from ONE workspace path (rendered values
      # embed absolute paths), redaction replay, semantic diff, shadow check
      # and the comment. The merge result renders first: its redaction maps
      # scrub the baseline.
      - name: Review
        id: review
        uses: max06/atlas/.github/actions/atlas-review@main
        with:
          helmfile-path: ${{ inputs.helmfile-path }}
          base: ${{ steps.baseline-rev.outputs.sha }}
          render-subset: ${{ steps.subset.outputs.mode }}
          diff-mode: ${{ inputs.diff-mode }}
          sops-age-key: ${{ secrets.sops-age-key || secrets.SOPS_AGE_KEY }}
          merge-fallback: ${{ steps.merge-checkout.outcome == 'failure' }}
          latest-atlas-tag: ${{ steps.latest-release.outputs.tag }}
          latest-main-sha: ${{ steps.latest-release.outputs.main_sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ── Post results ───────────────────────────────────────────────────────
      - name: Post PR comment
        if: always() && steps.review.outputs.body
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: atlas-review
          message: ${{ steps.review.outputs.body }}

      - name: Write job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Host monitor log (debug)
        if: always() && runner.debug == '1'
        run: tail -n 400 "$RUNNER_TEMP/host-monitor.log" 2>/dev/null || echo "no monitor log"

      - name: Gate on PR render status
        if: always() && steps.review.outputs.pr_status == 'error'
        run: |
          echo "::error::Merge result failed to render — see the PR comment for details"
          exit 1
