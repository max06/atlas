# ATLAS Review — Reusable GitHub Actions Workflow
#
# Compares rendered Kubernetes manifests between the current target branch HEAD
# and the merge result of a pull request using Docker container actions for
# rendering (atlas-render) and diffing (atlas-diff). Tool installation is baked
# into the Docker images; checkout logic stays visible in the workflow.
#
# Merge-result strategy: the baseline is the live target-branch HEAD (what is
# deployed now); the PR side is GitHub's trial merge ref (what will be deployed
# after merging). This avoids both false positives and hidden-impact diffs that
# plague branch-origin comparisons. See the old monolith for the full rationale.
#
# Error handling:
#   - Baseline render errors → warning (the PR may be the fix)
#   - PR render errors → pipeline failure (can't verify the PR is safe)
#
# Changed-file render subsetting (input `render-subset`):
#   The ATLAS directory convention is the dependency graph, so the PR's changed
#   paths select the (cluster, deployment) pairs whose render can differ. Both
#   revisions' discovery maps (ATLAS_DISCOVERY_MAP) plus `git diff --name-status`
#   feed the classifier (atlas-render mode=classify); default-deny — anything
#   outside deployments/templates, global values, or the entry helmfile means a
#   full render. Modes:
#     off    — classic full render, no classification
#     shadow — full render, classification computed alongside and CHECKED: every
#              changed release must lie inside the selection (default; the cutover
#              gate — a violation surfaces as a warning in the comment)
#     on     — render only the selection
#   Escape hatch: a PR label (input `full-render-label`) forces `off`. A pinned
#   ATLAS without map support falls back to a full render automatically.
#
# Usage in consumer repos:
#
#   # .github/workflows/atlas-review.yml
#   name: ATLAS Review
#   on:
#     pull_request:
#       branches: [main]
#   jobs:
#     review:
#       uses: max06/atlas/.github/workflows/snapshot-review.yml@main
#       with:
#         helmfile-path: helmfile.yaml.gotmpl
#       secrets:
#         sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

name: ATLAS Review

on:
  workflow_call:
    inputs:
      helmfile-path:
        description: "Path to the helmfile entry point"
        type: string
        default: "helmfile.yaml.gotmpl"
      diff-mode:
        description: 'Diff engine: "dyff" (default) for YAML-aware semantic diffs, "classic" for standard unified diffs'
        type: string
        default: "dyff"
      render-subset:
        description: 'Changed-file render subsetting: "off", "shadow" (default — full render + coverage check of the classifier), or "on"'
        type: string
        default: "shadow"
      full-render-label:
        description: "PR label that forces a full render (subsetting off) for that PR"
        type: string
        default: "atlas-full-render"
    secrets:
      sops-age-key:
        required: false
        description: "SOPS Age private key for decrypting *.values.sops.yaml files"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check for latest ATLAS release
        id: latest-release
        continue-on-error: true
        run: |
          LATEST_TAG=$(gh release list -R max06/atlas --limit 1 \
            --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          MAIN_SHA=$(gh api repos/max06/atlas/commits/main \
            --jq '.sha' 2>/dev/null || echo "")
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # ── Subsetting mode ────────────────────────────────────────────────────
      - name: Determine render-subsetting mode
        id: subset
        env:
          REQUESTED: ${{ inputs.render-subset }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, inputs.full-render-label) }}
        run: |
          MODE="$REQUESTED"
          case "$MODE" in off|shadow|on) ;; *) echo "::warning::render-subset='$MODE' unknown — using shadow"; MODE=shadow ;; esac
          if [ "$LABELED" = "true" ]; then
            echo "PR carries the full-render label — subsetting off for this run"
            MODE=off
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # ── Render merge result (PR side) ──────────────────────────────────────
      # Order matters: PR render runs first to capture sidedump maps that the
      # replay step uses to scrub the (potentially leaky) baseline.
      - name: Checkout merge result
        id: merge-checkout
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
        continue-on-error: true

      - name: Fallback to PR branch
        if: steps.merge-checkout.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # ── Classification inputs ──────────────────────────────────────────────
      # The target branch tip is fetched into a worktree so its discovery map
      # and the changed-file list are available BEFORE the first render, without
      # a third checkout. Any failure here leaves the outputs empty, and the
      # classifier then defaults to a full render.
      - name: Prepare classification inputs
        id: prep
        if: steps.subset.outputs.mode != 'off'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git fetch --depth=1 origin "refs/heads/${BASE_REF}" \
             && git worktree add --detach "${RUNNER_TEMP}/base-tree" FETCH_HEAD \
             && git diff --name-status --no-renames FETCH_HEAD HEAD > "${RUNNER_TEMP}/changes.txt"; then
            echo "base_tree=${RUNNER_TEMP}/base-tree" >> "$GITHUB_OUTPUT"
            echo "changes_file=${RUNNER_TEMP}/changes.txt" >> "$GITHUB_OUTPUT"
            echo "Changed paths: $(wc -l < "${RUNNER_TEMP}/changes.txt")"
          else
            echo "::warning::Could not prepare classification inputs — full render"
            echo "base_tree=" >> "$GITHUB_OUTPUT"
            echo "changes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Discovery map (merge result)
        id: map-pr
        if: steps.subset.outputs.mode != 'off'
        uses: max06/atlas/.github/actions/atlas-render@review-subsetting
        with:
          mode: discover
          helmfile-path: ${{ inputs.helmfile-path }}
          snapshot-label: pr

      - name: Discovery map (target branch)
        id: map-baseline
        if: steps.subset.outputs.mode != 'off' && steps.prep.outputs.base_tree != ''
        uses: max06/atlas/.github/actions/atlas-render@review-subsetting
        with:
          mode: discover
          helmfile-path: ${{ steps.prep.outputs.base_tree }}/${{ inputs.helmfile-path }}
          snapshot-label: baseline

      - name: Classify changed paths
        id: classify
        if: steps.subset.outputs.mode != 'off'
        uses: max06/atlas/.github/actions/atlas-render@review-subsetting
        with:
          mode: classify
          helmfile-path: ${{ inputs.helmfile-path }}
          snapshot-label: classify
          map-baseline: ${{ steps.map-baseline.outputs.map_file }}
          map-pr: ${{ steps.map-pr.outputs.map_file }}
          changes-file: ${{ steps.prep.outputs.changes_file }}

      - name: Render PR side
        uses: max06/atlas/.github/actions/atlas-render@review-subsetting
        id: pr
        with:
          helmfile-path: ${{ inputs.helmfile-path }}
          snapshot-label: pr
          sops-age-key: ${{ secrets.sops-age-key }}
          enable-sidedump: "true"
          blocking: "true"
          merge-fallback: ${{ steps.merge-checkout.outcome == 'failure' }}
          pairs-file: ${{ (steps.subset.outputs.mode == 'on' && steps.classify.outputs.mode == 'subset') && steps.classify.outputs.pairs_pr_file || '' }}

      # ── Render baseline (target branch) ────────────────────────────────────
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          clean: false

      - name: Render baseline
        uses: max06/atlas/.github/actions/atlas-render@review-subsetting
        id: baseline
        with:
          helmfile-path: ${{ inputs.helmfile-path }}
          snapshot-label: baseline
          sops-age-key: ${{ secrets.sops-age-key }}
          enable-sidedump: "false"
          blocking: "false"
          pairs-file: ${{ (steps.subset.outputs.mode == 'on' && steps.classify.outputs.mode == 'subset') && steps.classify.outputs.pairs_baseline_file || '' }}

      # ── Diff, replay, and comment ──────────────────────────────────────────
      - name: Diff and build comment
        uses: max06/atlas/.github/actions/atlas-diff@review-subsetting
        id: diff
        with:
          baseline-dir: ${{ steps.baseline.outputs.snapshot_dir }}
          pr-dir: ${{ steps.pr.outputs.snapshot_dir }}
          sidedump-map-dir: ${{ steps.pr.outputs.sidedump_dir }}
          baseline-status: ${{ steps.baseline.outputs.status }}
          pr-status: ${{ steps.pr.outputs.status }}
          merge-fallback: ${{ steps.merge-checkout.outcome == 'failure' }}
          baseline-filter: ${{ steps.baseline.outputs.filter_supported }}
          pr-filter: ${{ steps.pr.outputs.filter_supported }}
          workflow-pin-target: ${{ steps.baseline.outputs.workflow_pin }}
          workflow-pin-merge: ${{ steps.pr.outputs.workflow_pin }}
          latest-atlas-tag: ${{ steps.latest-release.outputs.tag }}
          latest-main-sha: ${{ steps.latest-release.outputs.main_sha }}
          helmfile-path: ${{ inputs.helmfile-path }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          diff-mode: ${{ inputs.diff-mode }}
          subset-mode: ${{ steps.subset.outputs.mode }}
          classify-dir: ${{ steps.classify.outputs.classify_dir }}
          render-mode: ${{ steps.pr.outputs.render_mode }}

      # ── Post results ───────────────────────────────────────────────────────
      - name: Post PR comment
        if: always() && steps.diff.outputs.body
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: atlas-review
          message: ${{ steps.diff.outputs.body }}

      - name: Write job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate on PR render status
        if: always() && steps.pr.outputs.status == 'error'
        run: |
          echo "::error::Merge result failed to render — see the PR comment for details"
          exit 1
