# ATLAS internal tests — verifies the inheritance pipeline, SOPS decryption,
# named instances, and multi-template rendering against the mocked fixtures
# under tests/deployments/ and tests/templates/.
#
# Runs on every push and PR touching test inputs or template code.
# Tests a matrix of Helm × Helmfile versions to catch compatibility issues.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Version policy: latest patch release of every supported minor,
      # plus the production baseline pins (helm v4.1.4 / helmfile v1.5.0,
      # what the argo-cd-helmfile plugin image ships) and `latest`.
      # helm v4.2.1/v4.2.2 are intentionally not listed: 4.2.1 shipped a
      # WaitForDelete fix that 4.2.2 reverted; 4.2.3 == 4.2.2 + dep bump.
      matrix:
        helm-version:
          - v4.0.5
          - v4.1.4
          - v4.2.3
          - latest
        helmfile-version:
          - v1.3.2
          - v1.4.5
          - v1.5.5
          - v1.6.0
          - v1.7.3
          - latest
    name: helm ${{ matrix.helm-version }} / helmfile ${{ matrix.helmfile-version }}
    env:
      SOPS_AGE_KEY_FILE: ${{ github.workspace }}/tests/sops-secret.txt
    steps:
      - uses: actions/checkout@v7

      - name: Install SOPS
        uses: nhedger/setup-sops@v3

      - name: Install helm
        run: |
          if [ "${{ matrix.helm-version }}" = "latest" ]; then
            VERSION=$(curl -fsSL https://api.github.com/repos/helm/helm/releases/latest | jq -r .tag_name)
          else
            VERSION="${{ matrix.helm-version }}"
          fi
          curl -fsSL "https://get.helm.sh/helm-${VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64

      - name: Install helmfile
        run: |
          if [ "${{ matrix.helmfile-version }}" = "latest" ]; then
            VERSION=$(curl -fsSL https://api.github.com/repos/helmfile/helmfile/releases/latest | jq -r .tag_name)
          else
            VERSION="${{ matrix.helmfile-version }}"
          fi
          CLEAN_VERSION="${VERSION#v}"
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/${VERSION}/helmfile_${CLEAN_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv helmfile /usr/local/bin/helmfile

      - name: Install helmfile plugins
        run: helmfile init --force 2>/dev/null || true

      - name: Install bats, yq, and parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y bats bats-assert bats-support parallel
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Show versions
        run: |
          echo "Helm: $(helm version --short 2>&1)"
          echo "Helmfile: $(helmfile version 2>&1)"
          echo "SOPS: $(sops --version 2>&1)"
          echo "yq: $(yq --version 2>&1)"
          echo "bats: $(bats --version 2>&1)"

      - name: Run bats tests
        run: bats --recursive --jobs 4 tests/bats/values/ tests/bats/redaction/ tests/bats/integration/
