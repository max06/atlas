# A Secret mixing three value origins:
#   data.generatedCert — plain template value, base64-encoded by the chart
#                        (stands in for chart-generated certs)
#   stringData.fromSops — hierarchy SOPS value (in the replacement map):
#                         proves the structural pass hashes the REAL value
#                         (pass order), not the map-redacted shape
#   stringData.note     — plain value, proves everything under a Secret is
#                         redacted regardless of origin
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  generatedCert: {{ .Values.certContent | b64enc }}
stringData:
  fromSops: {{ .Values.sopsGlobal | quote }}
  note: {{ .Values.plainNote | quote }}
---
# Scope boundary: the SAME plain value outside a Secret must stay readable —
# structural redaction is per-document, not a global value hunt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-copy
  namespace: {{ .Release.Namespace }}
data:
  note: {{ .Values.plainNote | quote }}
