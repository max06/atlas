# Test: Grouped cluster (group1/cluster2) with full inheritance chain
# Template: app1 (has template-include + template-defaults)
# Scenario: Chart defaults → Template-include → Template-defaults → Global → Group → Cluster → Deployment
#
# Template values (from app1):
#   - values.yaml.gotmpl           (templateInclude, templateOverride=include, overrideAll=templateInclude)
#   - inline map                   (templateDefault, templateOverride=default, overrideAll=templateDefault)
#
# Hierarchy values loaded (sops → yaml → gotmpl per level):
#   1. global.values.sops.yaml            (sopsGlobal, sopsString, sopsNumber, sopsBool, sopsOverride=global, sopsNested)
#   2. global.values.yaml                 (globalOnly, overrideGroupUp, overrideClusterUp, overrideAll, gotmplTest, nested)
#   3. global.values.yaml.gotmpl          (gotmplTest override)
#   4. group1/group.values.sops.yaml      (sopsGroup, sopsOverride=group, sopsList, sopsBoolTrue/False, sopsNested)
#   5. group1/group.values.yaml           (groupOnly, overrideGroupUp, overrideClusterUp, overrideAll, nested)
#   6. group1/cluster2/cluster.values.sops.yaml (sopsCluster, sopsOverride=cluster, sopsNested)
#   7. group1/cluster2/cluster.values.yaml (clusterOnly, overrideClusterUp, overrideAll, nested)
#   8. deployment2/values.sops.yaml        (sopsDeployment, sopsOverride=deployment, sopsNested)
#   9. deployment2/values.yaml             (deploymentOnly, overrideAll, nested)
#
# Group level IS loaded because cluster2 is under group1 ("/" in path).
tests:
  # --- Template-level values ---

  - it: should load template-include values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.templateInclude
          value: fromInclude

  - it: should load template-defaults values
    asserts:
      - equal:
          path: data.values.templateDefault
          value: fromDefault

  - it: should have template-defaults override template-include for shared key
    asserts:
      - equal:
          path: data.values.templateOverride
          value: default

  # --- Hierarchy-level values ---

  - it: should load global values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal

  - it: should load group values for grouped cluster
    asserts:
      - equal:
          path: data.values.groupOnly
          value: fromGroup

  - it: should load cluster values
    asserts:
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should load deployment values
    asserts:
      - equal:
          path: data.values.deploymentOnly
          value: fromDeployment

  # --- Override precedence ---

  - it: should have group override global for overrideGroupUp
    asserts:
      - equal:
          path: data.values.overrideGroupUp
          value: group

  - it: should have cluster override group for overrideClusterUp
    asserts:
      - equal:
          path: data.values.overrideClusterUp
          value: cluster

  - it: should have deployment override all levels including template for overrideAll
    asserts:
      - equal:
          path: data.values.overrideAll
          value: deployment

  - it: should have gotmpl override yaml at global level
    asserts:
      - equal:
          path: data.values.gotmplTest
          value: gotmpl

  # --- Deep merge ---

  - it: should deep merge nested values from global
    asserts:
      - equal:
          path: data.values.nested.fromGlobal
          value: true

  - it: should deep merge nested values from group
    asserts:
      - equal:
          path: data.values.nested.fromGroup
          value: true

  - it: should deep merge nested values from cluster
    asserts:
      - equal:
          path: data.values.nested.fromCluster
          value: true

  - it: should deep merge nested values from deployment
    asserts:
      - equal:
          path: data.values.nested.fromDeployment
          value: true

  - it: should have deployment win nested shared key
    asserts:
      - equal:
          path: data.values.nested.shared
          value: deployment

  # --- SOPS decryption ---

  - it: should decrypt sops string from global level
    asserts:
      - equal:
          path: data.values.sopsGlobal
          value: secretGlobalValue
      - equal:
          path: data.values.sopsString
          value: hello-from-sops

  - it: should decrypt sops number and boolean from global level
    asserts:
      - equal:
          path: data.values.sopsNumber
          value: 42
      - equal:
          path: data.values.sopsBool
          value: true

  - it: should decrypt sops list from group level
    asserts:
      - equal:
          path: data.values.sopsList[0]
          value: itemOne
      - equal:
          path: data.values.sopsList[1]
          value: itemTwo
      - equal:
          path: data.values.sopsList[2]
          value: itemThree

  - it: should decrypt sops booleans from group level
    asserts:
      - equal:
          path: data.values.sopsBoolTrue
          value: true
      - equal:
          path: data.values.sopsBoolFalse
          value: false

  - it: should decrypt sops unique keys per level (grouped, all four)
    asserts:
      - equal:
          path: data.values.sopsGroup
          value: secretGroupValue
      - equal:
          path: data.values.sopsCluster
          value: secretCluster2Value
      - equal:
          path: data.values.sopsDeployment
          value: secretDep2Value

  - it: should have deployment sops override all sops levels for sopsOverride
    asserts:
      - equal:
          path: data.values.sopsOverride
          value: deployment

  - it: should deep merge sops nested across all four levels
    asserts:
      - equal:
          path: data.values.sopsNested.secretKey
          value: dep2NestedSecret
      - equal:
          path: data.values.sopsNested.level
          value: deployment

  # --- SOPS within-level precedence (.yaml overrides .sops.yaml) ---

  - it: should have yaml override sops for shared keys at same level
    # sopsOverride is set in both .sops.yaml and .yaml files at each level
    # The .yaml value (overrideAll) should take precedence over .sops.yaml (sopsOverride)
    # at the deployment level. Both ultimately resolve to "deployment" here,
    # but the key point is .yaml keys override .sops.yaml keys via mergeOverwrite.
    asserts:
      - equal:
          path: data.values.overrideAll
          value: deployment

  # --- Atlas context ---

  - it: should set correct atlas deployment context
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster2
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment2
