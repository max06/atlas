# Test: Deployment WITHOUT namespace property
# Template: app-novals (defines namespace: test in its release)
# Scenario: Namespace is optional in deployment.yaml — the template's namespace is used.
#
# This verifies that omitting the namespace property in a deployment's app entry
# does not cause an error and that the app template's own namespace is preserved.
tests:
  - it: should render successfully without namespace in deployment.yaml
    asserts:
      - isKind:
          of: ConfigMap

  - it: should set correct atlas deployment context
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: cluster1
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment10
