# Test: Global deployment (deployment5) rendered on grouped cluster (group1/cluster2)
# Template: app-global-test (no template-level values)
# Scenario: Verifies that the SAME global deployment appears on a grouped cluster
#   with that cluster's specific context and values.
#
# Hierarchy values loaded: Global + Group1 + Cluster2
tests:
  - it: should be assigned to group1/cluster2 with correct atlas context
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster2
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment5

  - it: should load global values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal

  - it: should load group values (grouped cluster)
    asserts:
      - equal:
          path: data.values.groupOnly
          value: fromGroup

  - it: should load cluster2 values
    asserts:
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should have group override global for overrideGroupUp
    asserts:
      - equal:
          path: data.values.overrideGroupUp
          value: group

  - it: should have cluster override group for overrideClusterUp
    asserts:
      - equal:
          path: data.values.overrideClusterUp
          value: cluster

  - it: should decrypt group sops values (not present on cluster1)
    asserts:
      - equal:
          path: data.values.sopsGroup
          value: secretGroupValue

  - it: should decrypt cluster2 sops values (different from cluster1)
    asserts:
      - equal:
          path: data.values.sopsCluster
          value: secretCluster2Value
