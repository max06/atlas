# Test: Standalone cluster (cluster1) with full inheritance chain
# Template: app1 (has template-include + template-defaults)
# Scenario: Chart defaults → Template-include → Template-defaults → Global → Cluster → Deployment
#
# Template values (from app1):
#   - values.yaml.gotmpl           (templateInclude, templateOverride=include, overrideAll=templateInclude)
#   - inline map                   (templateDefault, templateOverride=default, overrideAll=templateDefault)
#
# Hierarchy values loaded (sops → yaml → gotmpl per level):
#   1. global.values.sops.yaml     (sopsGlobal, sopsString, sopsNumber, sopsBool, sopsOverride=global, sopsNested)
#   2. global.values.yaml          (globalOnly, overrideGroupUp, overrideClusterUp, overrideAll, gotmplTest, nested)
#   3. global.values.yaml.gotmpl   (gotmplTest override)
#   4. cluster1/cluster.values.sops.yaml (sopsCluster, sopsOverride=cluster, sopsFloat, sopsNested.deep)
#   5. cluster1/cluster.values.yaml (clusterOnly, overrideClusterUp, overrideAll, nested)
#   6. deployment1/values.sops.yaml (sopsDeployment, sopsOverride=deployment, sopsMap, sopsNested)
#   7. deployment1/values.yaml      (deploymentOnly, overrideAll, nested)
#
# Group level is SKIPPED because cluster1 is a standalone cluster (no "/" in path).
tests:
  # --- Template-level values ---

  - it: should load template-include values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.templateInclude
          value: fromInclude

  - it: should load template-defaults values
    asserts:
      - equal:
          path: data.values.templateDefault
          value: fromDefault

  - it: should have template-defaults override template-include for shared key
    asserts:
      - equal:
          path: data.values.templateOverride
          value: default

  # --- Hierarchy-level values ---

  - it: should load global values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal

  - it: should NOT load group values for standalone cluster
    asserts:
      - notExists:
          path: data.values.groupOnly

  - it: should load cluster values
    asserts:
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should load deployment values
    asserts:
      - equal:
          path: data.values.deploymentOnly
          value: fromDeployment

  # --- Override precedence ---

  - it: should keep global value for overrideGroupUp (no group to override it)
    asserts:
      - equal:
          path: data.values.overrideGroupUp
          value: global

  - it: should have cluster override global for overrideClusterUp
    asserts:
      - equal:
          path: data.values.overrideClusterUp
          value: cluster

  - it: should have deployment override all levels including template for overrideAll
    asserts:
      - equal:
          path: data.values.overrideAll
          value: deployment

  - it: should have gotmpl override yaml at global level
    asserts:
      - equal:
          path: data.values.gotmplTest
          value: gotmpl

  - it: should have gotmpl reference values from earlier loaded sops file
    asserts:
      - equal:
          path: data.values.gotmplFromSops
          value: secretGlobalValue

  - it: should have gotmpl reference values from earlier loaded yaml file
    asserts:
      - equal:
          path: data.values.gotmplFromYaml
          value: fromGlobal

  # --- Deep merge ---

  - it: should deep merge nested values from global
    asserts:
      - equal:
          path: data.values.nested.fromGlobal
          value: true

  - it: should NOT have nested group values for standalone cluster
    asserts:
      - notExists:
          path: data.values.nested.fromGroup

  - it: should deep merge nested values from cluster
    asserts:
      - equal:
          path: data.values.nested.fromCluster
          value: true

  - it: should deep merge nested values from deployment
    asserts:
      - equal:
          path: data.values.nested.fromDeployment
          value: true

  - it: should have deployment win nested shared key
    asserts:
      - equal:
          path: data.values.nested.shared
          value: deployment

  # --- SOPS decryption ---

  - it: should decrypt sops string from global level
    asserts:
      - equal:
          path: data.values.sopsGlobal
          value: secretGlobalValue
      - equal:
          path: data.values.sopsString
          value: hello-from-sops

  - it: should decrypt sops number from global level
    asserts:
      - equal:
          path: data.values.sopsNumber
          value: 42

  - it: should decrypt sops boolean from global level
    asserts:
      - equal:
          path: data.values.sopsBool
          value: true

  - it: should decrypt sops float from cluster level
    asserts:
      - equal:
          path: data.values.sopsFloat
          value: 3.14

  - it: should decrypt sops map from deployment level
    asserts:
      - equal:
          path: data.values.sopsMap.username
          value: admin
      - equal:
          path: data.values.sopsMap.password
          value: "s3cret!"
      - equal:
          path: data.values.sopsMap.port
          value: 5432

  - it: should decrypt sops unique keys per level (standalone, no group)
    asserts:
      - equal:
          path: data.values.sopsCluster
          value: secretCluster1Value
      - equal:
          path: data.values.sopsDeployment
          value: secretDep1Value
      - notExists:
          path: data.values.sopsGroup

  - it: should have deployment sops override all sops levels for sopsOverride
    asserts:
      - equal:
          path: data.values.sopsOverride
          value: deployment

  - it: should deep merge sops nested across levels
    asserts:
      - equal:
          path: data.values.sopsNested.secretKey
          value: dep1NestedSecret
      - equal:
          path: data.values.sopsNested.level
          value: deployment
      - equal:
          path: data.values.sopsNested.deep.verySecret
          value: hiddenValue

  # --- Atlas context ---

  - it: should set correct atlas deployment context
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: cluster1
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment1
