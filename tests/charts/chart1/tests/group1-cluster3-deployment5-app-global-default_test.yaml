# Test: Global deployment (deployment5) rendered on grouped cluster (group1/cluster3)
# Template: app-global-test (no template-level values)
# Scenario: Verifies that the SAME global deployment appears on cluster3 which has
#   NO cluster-level values. Group is the highest-priority override.
#
# Hierarchy values loaded: Global + Group1 (no cluster3 values)
tests:
  - it: should be assigned to group1/cluster3 with correct atlas context
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster3
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment5

  - it: should load global values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal

  - it: should load group values
    asserts:
      - equal:
          path: data.values.groupOnly
          value: fromGroup

  - it: should NOT have cluster-only values (no cluster3 values file)
    asserts:
      - notExists:
          path: data.values.clusterOnly

  - it: should have group win overrideClusterUp (no cluster to override)
    asserts:
      - equal:
          path: data.values.overrideClusterUp
          value: group

  - it: should NOT have cluster sops values
    asserts:
      - notExists:
          path: data.values.sopsCluster
