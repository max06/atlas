# Test: Duplicate-template deployment (deployment9), first instance: primary
# Template: app-named (used twice with different names)
# Scenario: deployment9 uses app-named twice, disambiguated by name.
#   This test verifies the FIRST named instance (primary) gets correct context
#   and that atlas.instance.name is set to "primary".
tests:
  - it: should use instance name as suffix in release name
    release:
      name: app-named-primary
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: app-named-primary-chart1

  - it: should have atlas.instance.name set to primary
    asserts:
      - equal:
          path: data.values.atlas.instance.name
          value: primary

  - it: should have atlas.instance.template set to app-named
    asserts:
      - equal:
          path: data.values.atlas.instance.template
          value: app-named

  - it: should load hierarchy values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should set correct atlas deployment context
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: cluster1
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment9
