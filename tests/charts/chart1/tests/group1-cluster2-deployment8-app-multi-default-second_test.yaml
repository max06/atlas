# Test: Multi-release template (deployment8), second release: app-multi-second
# Template: app-multi (defines 2 releases in one helmfile.yaml.gotmpl)
# Scenario: Verifies the SECOND release gets its OWN template-default (multiRelease: second),
#   NOT the first release's value. Both share the same hierarchy values.
#
# This proves that template-defaults are per-release, not shared across releases.
tests:
  - it: should have multiRelease set to second (not first)
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.multiRelease
          value: second

  - it: should load the same hierarchy values as the first release
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal
      - equal:
          path: data.values.groupOnly
          value: fromGroup
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should set the same atlas context as the first release
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster2
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment8
