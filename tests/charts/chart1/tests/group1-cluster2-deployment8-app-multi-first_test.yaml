# Test: Multi-release template (deployment8), first release: app-multi-first
# Template: app-multi (defines 2 releases in one helmfile.yaml.gotmpl)
# Scenario: Verifies the FIRST release gets its template-default (multiRelease: first)
#   AND the hierarchy values from group1/cluster2.
#
# This proves that when an app template defines multiple releases, each release
# is independently processed and gets its own template-defaults + hierarchy values.
tests:
  - it: should have multiRelease set to first
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.multiRelease
          value: first

  - it: should load hierarchy values from group1/cluster2
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal
      - equal:
          path: data.values.groupOnly
          value: fromGroup
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should set correct atlas context
    asserts:
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster2
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment8
