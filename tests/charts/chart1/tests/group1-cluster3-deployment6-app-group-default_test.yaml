# Test: Group-level deployment (deployment6) rendered on group1/cluster3
# Template: app-group-test (no template-level values)
# Scenario: Verifies that the SAME group-level deployment also appears on cluster3.
#   cluster3 has no cluster-level values, so group is highest override.
#
# Hierarchy values loaded: Global + Group1 (no cluster3 values)
tests:
  - it: should be assigned to group1/cluster3 with correct atlas context
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster3
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment6

  - it: should load group values
    asserts:
      - equal:
          path: data.values.groupOnly
          value: fromGroup

  - it: should NOT have cluster-only values
    asserts:
      - notExists:
          path: data.values.clusterOnly

  - it: should have group win overrideAll (no cluster or deployment values)
    asserts:
      - equal:
          path: data.values.overrideAll
          value: group

  - it: should NOT have cluster sops values
    asserts:
      - notExists:
          path: data.values.sopsCluster
