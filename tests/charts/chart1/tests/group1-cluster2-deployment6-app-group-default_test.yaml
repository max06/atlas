# Test: Group-level deployment (deployment6) rendered on group1/cluster2
# Template: app-group-test (no template-level values)
# Scenario: Verifies that a group-level deployment (deployments/group1/apps/deployment6/)
#   is correctly assigned to a cluster within that group.
#
# Hierarchy values loaded: Global + Group1 + Cluster2
tests:
  - it: should be assigned to group1/cluster2 with correct atlas context
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.values.atlas.deployment.cluster
          value: group1/cluster2
      - equal:
          path: data.values.atlas.deployment.deploymentName
          value: deployment6

  - it: should load global values
    asserts:
      - equal:
          path: data.values.globalOnly
          value: fromGlobal

  - it: should load group values
    asserts:
      - equal:
          path: data.values.groupOnly
          value: fromGroup

  - it: should load cluster2 values
    asserts:
      - equal:
          path: data.values.clusterOnly
          value: fromCluster

  - it: should have cluster override group for overrideClusterUp
    asserts:
      - equal:
          path: data.values.overrideClusterUp
          value: cluster

  - it: should have cluster2 sops values
    asserts:
      - equal:
          path: data.values.sopsCluster
          value: secretCluster2Value
