# Fixture: instance-level inline values (apps[].values list in deployment.yaml)
# are the most specific layer: they win over the template AND over every
# file of the directory hierarchy, including this deployment's own values.yaml.
# Uses the app1 template so we have template-include + template-defaults
# layers to test against.
#
# Expected precedence (established by _values_loader.tpl):
#   chart defaults < template-include < template-defaults < hierarchy < instance inline
#
# Keys set here to probe each boundary:
#   - instanceOnly:     unique key — proves instance values are delivered at all
#   - templateInclude:  collides with app1/values.yaml.gotmpl — instance wins
#   - templateDefault:  collides with app1 inline template-defaults — instance wins
#   - globalOnly:       collides with global.values.yaml — instance wins
#   - clusterOnly:      collides with cluster1/cluster.values.yaml — instance wins
#   - deploymentShared: collides with this deployment's values.yaml — instance wins
#   (deploymentOnly is set only in values.yaml next to this file: the
#   deployment layer itself is still delivered)
apps:
  - template: app1
    namespace: test
    values:
      - instanceOnly: fromInstance
        templateInclude: fromInstance
        templateDefault: fromInstance
        globalOnly: fromInstance
        clusterOnly: fromInstance
        deploymentShared: fromInstance
settings:
  branch: main
  autoSync: false
