# Argo CD config management plugin: the atlas image as repo-server sidecar.
#
# Plugin name = <name>-<version> = atlas-v0. An Application selects it with
# spec.source.plugin.name and passes ATLAS_FILTER_CLUSTER /
# ATLAS_FILTER_DEPLOYMENT_NAME (and optionally HELMFILE_USE_CONTEXT_NAMESPACE)
# as plugin env. No discover rule: the plugin runs only when named.
apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: atlas
spec:
  version: v0
  generate:
    command: [atlas, render, --argocd]
